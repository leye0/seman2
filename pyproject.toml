[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seman2"
version = "0.2.0"
description = "Source-faithful dialogue and native ERG semantic analysis"
requires-python = ">=3.12"
dependencies = ["pydelphin==1.11.0"]

[tool.setuptools]
package-dir = {"" = "superparser"}

[tool.setuptools.packages.find]
where = ["superparser"]
