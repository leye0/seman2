syntax = "proto3";

package seman2.graph.v1;

message Span {
  string coordinate_system = 1;
  int64 start = 2;
  int64 end = 3;
  string unit = 4;
}

message ExternalAnnotation {
  string id = 1;
  string input_observation_id = 2;
  string producer = 3;
  string producer_version = 4;
  string parameters_json = 5;
  string model = 6;
  string formalism = 7;
  string annotation_type = 8;
  string raw_value_json = 9;
  repeated Span spans = 10;
  repeated string alternatives_json = 11;
  repeated string constraints_json = 12;
  optional double score = 13;
  string input_modality = 14;
  bool derived_from_text = 15;
  bool is_audio_observation = 16;
  string source_artifact = 17;
  string source_selector = 18;
}
