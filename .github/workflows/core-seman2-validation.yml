name: Core Seman2 Research Validation
on:
  push:
    branches:
      - main
      - research/verbnet-left-to-right-poc
    paths:
      - 'superparser/seman_parser/**'
      - 'superparser/data/**'
      - 'superparser/tests/test_verbnet_lr_hybrid_vector.py'
      - 'superparser/tests/test_dialogue_grammar.py'
      - 'superparser/tests/test_vector_chart.py'
      - 'superparser/tests/test_sentence_boundaries.py'
      - 'superparser/tests/test_structural_prefix_risk.py'
      - 'superparser/tests/test_continuation_probe.py'
      - '.github/workflows/core-seman2-validation.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-seman2-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch WordNet
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          url='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url,headers={'User-Agent':'Seman2-research'}),timeout=90) as f:
              content=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          allowed={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              allowed.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(content)) as z:
              for item in z.namelist():
                  base=Path(item).name
                  if item.startswith('wordnet/') and base in allowed:
                      (dest/base).write_bytes(z.read(item))
          assert (dest/'index.verb').exists()
          PY
      - name: Diagnose complete syntax and semantic roles
        env:
          WORDNET_DICT: ${{ runner.temp }}/wordnet3/dict
          PYTHONPATH: superparser
        run: |
          python - <<'PY'
          from seman_parser import Parser
          from seman_parser.engine import ParserResources
          from seman_parser.segmentation import build_lattice
          from pathlib import Path
          p=Parser(ParserResources.from_dir(Path('superparser/data'),wordnet_dict=__import__('os').environ['WORDNET_DICT']),cache_size=0)
          for text in ('John gave Mary the box.', 'Mom worked during the day, Dad sometimes worked from home, Eli was learning to read longer sentences, and somebody always needed the bathroom when somebody else was late.'):
              report=p.parse(text)
              result=report.result
              best=result.best()
              print('DIAGNOSTIC',text,'completed',result.completed,'best',best.rule_id if best else None,'stats',{k:result.stats.get(k) for k in ('budget_exceeded','kbest_budget_exceeded','forest_nodes','partial_states','best_ms','engine')})
              if best:
                  print('ROLES',[(r.relation,r.source,r.target) for r in report.interpret(best).graph.relations])
              if text.startswith('John'):
                  l=build_lattice(text,p.resources.lexicon,multiword_max=1)
                  for x in l.candidates:
                      if x.surface.casefold() in ('gave','mary'):
                          print('LEX',x.surface,x.category,x.features.as_dict(),x.sense_ids)
          PY
      - name: Regressions — parser, quotations and structural diagnostics
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -m unittest -v \
            superparser.tests.test_verbnet_lr_hybrid_vector \
            superparser.tests.test_dialogue_grammar \
            superparser.tests.test_vector_chart \
            superparser.tests.test_sentence_boundaries \
            superparser.tests.test_structural_prefix_risk \
            superparser.tests.test_continuation_probe
