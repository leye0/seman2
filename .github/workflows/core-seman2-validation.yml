name: Core Seman2 Research Validation
on:
  push:
    branches:
      - main
      - research/verbnet-left-to-right-poc
    paths:
      - 'superparser/seman_parser/**'
      - 'superparser/data/**'
      - 'superparser/tests/test_verbnet_lr_hybrid_vector.py'
      - 'superparser/tests/test_dialogue_grammar.py'
      - 'superparser/tests/test_vector_chart.py'
      - 'superparser/tests/test_sentence_boundaries.py'
      - 'superparser/tests/test_structural_prefix_risk.py'
      - 'superparser/tests/test_continuation_probe.py'
      - '.github/workflows/core-seman2-validation.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-seman2-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regressions — parser, quotations and structural diagnostics
        run: |
          PYTHONPATH=superparser python -m unittest -v \
            superparser.tests.test_verbnet_lr_hybrid_vector \
            superparser.tests.test_dialogue_grammar \
            superparser.tests.test_vector_chart \
            superparser.tests.test_sentence_boundaries \
            superparser.tests.test_structural_prefix_risk \
            superparser.tests.test_continuation_probe
