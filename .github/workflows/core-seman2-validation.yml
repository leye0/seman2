name: Seman2 Layer 1 — Canonical and Adaptive Regression
on:
  push:
    branches: [main]
    paths:
      - 'superparser/research/canonical_validation_trigger.txt'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: layer1-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch WordNet
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          url='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url,headers={'User-Agent':'Seman2-research'}),timeout=90) as f:
              content=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          allowed={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              allowed.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(content)) as z:
              for item in z.namelist():
                  base=Path(item).name
                  if item.startswith('wordnet/') and base in allowed:
                      (dest/base).write_bytes(z.read(item))
          assert (dest/'index.verb').exists()
          PY
      - name: Audit passive coordination fragments through public parser
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -m scripts.audit_passive_fragments
      - name: Run current Layer 1 test suite
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -m unittest -v \
            superparser.tests.test_parser_integration \
            superparser.tests.test_literary_lexicon_audit \
            superparser.tests.test_runtime_gc \
            superparser.tests.test_features \
            superparser.tests.test_coverage \
            superparser.tests.test_data \
            superparser.tests.test_syntax_semantics_boundary \
            superparser.tests.test_layer1_output_contract \
            superparser.tests.test_dialogue_grammar \
            superparser.tests.test_vector_chart \
            superparser.tests.test_sentence_boundaries \
            superparser.tests.test_complexity_routing \
            superparser.tests.test_shared_trie_forest \
            superparser.tests.test_clean_novel_corpus \
            superparser.tests.test_compass_notation \
            superparser.tests.test_dialogue_contextual_fragments \
            superparser.tests.test_reduced_conditional_parentheticals \
            superparser.tests.test_novel_parse_diagnostics \
            superparser.tests.test_context_dependencies \
            superparser.tests.test_syntax_correctness \
            superparser.tests.test_discovery_contract \
            superparser.tests.test_generic \
            superparser.tests.test_symbols_types \
            superparser.tests.test_verbnet_valence_provenance \
            superparser.tests.test_left_corner_tree_quality \
            superparser.tests.test_reference_300_evaluator \
            superparser.tests.test_verbnet_lr_gutenberg_novels \
            superparser.tests.test_marked_nonstandard_usage \
            superparser.tests.test_coordinated_supplementary_relatives \
            superparser.tests.test_case_480_marked_dialogue \
            superparser.tests.test_usage_diagnostic_contract \
            superparser.tests.test_marked_finite_agreement \
            superparser.tests.test_usage_explanations \
            superparser.tests.test_rejection_trace \
            superparser.tests.test_fast_preflight \
            superparser.tests.test_integrated_fast_preflight
      - name: Check global grammar quality for main commits and pull requests
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -m scripts.validate_direct_grammar --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" --out "$RUNNER_TEMP/direct-grammar-quality.json"
      - name: Report unlisted attested hyphenated compounds
        run: |
          PYTHONPATH=superparser python -m scripts.audit_literary_lexicon --top 30
      - name: Inspect actual best trees on three recovered novel cases
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -m scripts.audit_novel_tree_quality --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" --indices 8,44,86,87,94,107,124,178,212,213,215,218,226,232,236,250,308,313,316,321,328,331,338,343,349,357,359,361,365,368,399,403,405,412,413,423,427,435,438,439,458,459,473,480,486,487 --alternatives 1 --lexical-audit
      - name: Verify documented canonical, adaptive and dialogue execution
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -m scripts.smoke_layer1
