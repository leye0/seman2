name: Native ERG ACE Novel-1000
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'superparser/seman_parser/**'
      - 'superparser/research/**'
      - 'superparser/scripts/novel_sources.py'
      - 'superparser/scripts/benchmark_native_erg.py'
      - 'superparser/tests/**'
      - '.github/workflows/native-erg-novel1000.yml'
      - 'pyproject.toml'
      - 'requirements-canonical.txt'
permissions:
  contents: read
concurrency:
  group: native-erg-novel1000
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: superparser
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source extraction and adapter regression tests
        run: |
          python -m pip install 'pydelphin==1.11.0'
          python -m unittest discover -s superparser/tests
      - name: Install pinned native tooling
        run: |
          set -euo pipefail
          python -m pip install 'pydelphin==1.11.0'
          mkdir -p "$RUNNER_TEMP/erg"
          cd "$RUNNER_TEMP/erg"
          curl --fail --location --retry 3 https://sweaglesw.org/linguistics/ace/download/ace-0.9.34-x86-64.tar.gz -o ace.tar.gz
          tar -xzf ace.tar.gz
          find . -type f -name ace -executable -print
          ACE_BIN="$(find "$PWD" -type f -name ace -executable -print -quit)"
          test -n "$ACE_BIN"
          "$ACE_BIN" -V
          echo "ACE_BIN=$ACE_BIN" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://github.com/delph-in/erg/releases/download/2025/erg-2025-x86-64-0.9.34.dat.bz2 -o erg.dat.bz2
          bunzip2 erg.dat.bz2
          echo "ERG_GRAMMAR=$PWD/erg.dat" >> "$GITHUB_ENV"
          sha256sum "$ACE_BIN" erg.dat
      - name: Native controls and ten original sources
        run: |
          python -m scripts.benchmark_native_erg --ace "$ACE_BIN" --grammar "$ERG_GRAMMAR" --limit 10 --out-dir "$RUNNER_TEMP/erg-smoke"
      - name: Native full frozen corpus
        run: |
          python -m scripts.benchmark_native_erg --ace "$ACE_BIN" --grammar "$ERG_GRAMMAR" --out-dir "$RUNNER_TEMP/erg-full"
      - name: Publish untouched native derivations and MRS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-erg-novel1000
          path: |
            ${{ runner.temp }}/erg-smoke/
            ${{ runner.temp }}/erg-full/
          if-no-files-found: warn
          retention-days: 30
