name: Novel-700 remaining cases probe
on:
  push:
    branches: [research/novel-ladder-700-fix]
    paths:
      - 'superparser/tests/test_novel_700_residual.py'
      - '.github/workflows/novel-700-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          with urlopen(Request('https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip',headers={'User-Agent':'Seman2-research'}),timeout=90) as f:
              raw=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(raw)) as z:
              for item in z.namelist():
                  leaf=Path(item).name
                  if item.startswith('wordnet/') and leaf in keep:
                      (dest/leaf).write_bytes(z.read(item))
          PY
      - name: Probe 12 source-grounded residuals
        env:
          PYTHONPATH: superparser
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" python -m unittest -v superparser.tests.test_novel_700_residual superparser.tests.test_structural_preanalysis
