name: Full-Structure Snap Scale (Synthetic Research)

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - '.github/workflows/verbnet-snap-scale.yml'
      - 'superparser/scripts/benchmark_snap_scale.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test grammar-derived synthetic shape scaling
        run: |
          PYTHONPATH=superparser python superparser/scripts/benchmark_snap_scale.py \
            --sizes 100,1000,10000,100000 \
            --out /tmp/snap_scale_report.json
      - name: Upload measured results
        uses: actions/upload-artifact@v4
        with:
          name: snap-scaling-report
          path: /tmp/snap_scale_report.json
          retention-days: 14
