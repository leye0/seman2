name: 10000 Gutenberg Grammar Failures and Counterfactuals
on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - 'superparser/scripts/characterize_failed_10k.py'
      - 'superparser/tests/test_characterize_failed_10k.py'
      - '.github/workflows/characterize-failed-10k.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: characterize-failed-10k-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          with urlopen(Request('https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip',
                 headers={'User-Agent':'Seman2-research'}),timeout=90) as f:
              data=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(data)) as z:
              for name in z.namelist():
                  leaf=Path(name).name
                  if name.startswith('wordnet/') and leaf in keep:
                      (dest/leaf).write_bytes(z.read(name))
          PY
      - name: Validate grammar constraint ablation and failure categories
        run: |
          PYTHONPATH=superparser python -m unittest -v superparser.tests.test_characterize_failed_10k
      - name: Smoke test corpus collection and exact-lattice counterfactuals
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/characterize_failed_10k.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --size 80 --max-tokens 32 --checkpoint 20 \
            --sample-per-family 2 --kbest-work-limit 100000 \
            --out-dir /tmp/failed-10k-smoke
      - name: Collect 10000 sentences and isolate costly parse failure modes
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/characterize_failed_10k.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --size 10000 --max-tokens 32 --checkpoint 50 \
            --sample-per-family 15 --kbest-work-limit 100000 \
            --out-dir /tmp/failed-10k-corpus
      - name: Preserve corpus and diagnosis even on error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expensive-failed-10000-dickens-grammar
          path: |
            /tmp/failed-10k-corpus/
            /tmp/failed-10k-smoke/
          if-no-files-found: warn
          retention-days: 21
