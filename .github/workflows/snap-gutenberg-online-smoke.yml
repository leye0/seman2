name: Gutenberg All-Sentences Online Smoke

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - '.github/workflows/snap-gutenberg-online-smoke.yml'
      - 'superparser/research/verbnet_lr/compatible_category_sequences.py'
      - 'superparser/tests/test_verbnet_lr_compatible_category_sequences.py'
      - 'superparser/scripts/benchmark_snap_novels_online.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare WordNet
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import os
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          url='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url,headers={'User-Agent':'Seman2-research'}),timeout=90) as f: data=f.read()
          d=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          d.mkdir(parents=True,exist_ok=True)
          wanted={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for n in ('noun','verb','adj','adv'): wanted.update((f'index.{n}',f'data.{n}',f'{n}.exc'))
          with ZipFile(BytesIO(data)) as z:
              for name in z.namelist():
                  base=Path(name).name
                  if name.startswith('wordnet/') and base in wanted:
                      (d/base).write_bytes(z.read(name))
          assert (d/'index.verb').exists()
          PY
      - name: Test existential category compatibility
        run: |
          PYTHONPATH=superparser python -m unittest \
            superparser.tests.test_verbnet_lr_compatible_category_sequences \
            superparser.tests.test_snap_novels_online \
            superparser.tests.test_verbnet_lr_full_structure_snap -v
      - name: Process ALL 2500 sentences through lattice then snap/L-R
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_snap_novels_online.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --max-train 2500 --milestones 0,500,2500 \
            --every 10 --teacher-seconds 0.055 \
            --skip-full-holdout \
            --out /tmp/online-snapping-smoke.json
      - name: Save checked smoke numbers
        uses: actions/upload-artifact@v4
        with:
          name: all-sentences-online-smoke
          path: /tmp/online-snapping-smoke.json
          retention-days: 14
