name: Progressive Gutenberg Online Curve — 3000-sentence checkpoint

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - '.github/workflows/prepacked-online-curve-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sampled-curve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch WordNet
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          url='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url,headers={'User-Agent':'Seman2-research'}),timeout=90) as f:
              raw=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          needed={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              needed.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(raw)) as z:
              for item in z.namelist():
                  name=Path(item).name
                  if item.startswith('wordnet/') and name in needed:
                      (dest/name).write_bytes(z.read(item))
          assert (dest/'index.verb').exists()
          PY
      - name: Three thousand online parses with live adaptive learning
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_prepacked_online_long.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --max-sentences 3000 --max-tokens 24 \
            --checkpoint 250 --recompile-every 500 \
            --out /tmp/online-3000.json
      - name: Store observed curve
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-3000-online-curve
          path: /tmp/online-3000.json
          if-no-files-found: warn
          retention-days: 21
