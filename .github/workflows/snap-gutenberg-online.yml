name: Gutenberg All-Sentences Online Structure Snapping

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - '.github/workflows/snap-gutenberg-online.yml'
      - 'superparser/scripts/benchmark_snap_novels_online.py'
      - 'superparser/tests/test_snap_novels_online.py'
      - 'superparser/research/verbnet_lr/full_structure_snap.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-online:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all-category fingerprint and supplied lattice
        run: |
          PYTHONPATH=superparser python -m unittest \
            superparser.tests.test_snap_novels_online \
            superparser.tests.test_verbnet_lr_full_structure_snap -v
      - name: Prepare WordNet dictionary
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import os
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          source='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(source,headers={'User-Agent':'Seman2-research'}),timeout=90) as r:
              data=r.read()
          folder=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          folder.mkdir(parents=True,exist_ok=True)
          allowed={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for name in ('noun','verb','adj','adv'):
              allowed.update((f'index.{name}',f'data.{name}',f'{name}.exc'))
          with ZipFile(BytesIO(data)) as z:
              for entry in z.namelist():
                  basename=Path(entry).name
                  if entry.startswith('wordnet/') and basename in allowed:
                      (folder/basename).write_bytes(z.read(entry))
          assert (folder/'index.verb').exists()
          PY
      - name: Execute parser on every one of 50000 Gutenberg novel sentences
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_snap_novels_online.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --max-train 50000 --milestones 0,5000,20000,50000 \
            --every 10 --teacher-seconds 0.055 \
            --out /tmp/novel-all-sentences-online.json
      - name: Save aggregate results without novel text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gutenberg-all-sentences-online-report
          path: /tmp/novel-all-sentences-online.json
          if-no-files-found: warn
          retention-days: 30
