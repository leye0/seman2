name: Scoped batch-422 grammar probes (research)
on:
  pull_request:
    branches: [main]
    paths:
      - 'superparser/scripts/probe_batch_422_roots.py'
      - '.github/workflows/probe-batch-422.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch WordNet 3.0, same as existing Layer 1
        run: |
          mkdir -p "$RUNNER_TEMP/wordnet3"
          curl -fsSL https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip -o "$RUNNER_TEMP/wordnet3.zip"
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'wordnet3'
          with ZipFile(root.parent/'wordnet3.zip') as z:
              z.extractall(root)
          PY
      - name: Probe source-grounded candidate constituents
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/wordnet" PYTHONPATH=superparser python -u -m scripts.probe_batch_422_roots
      - name: Confirm current four families with exact selected-tree controls
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/wordnet" PYTHONPATH=superparser python -m unittest -q superparser.tests.test_batch_422_grammar

