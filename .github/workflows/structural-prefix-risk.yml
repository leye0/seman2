name: Grammar Continuation Prefix Risk Audit
on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - 'superparser/scripts/audit_structural_prefix_risk.py'
      - 'superparser/tests/test_continuation_probe.py'
      - 'superparser/tests/test_structural_prefix_risk.py'
      - 'superparser/research/verbnet_lr/continuation_probe.py'
      - '.github/workflows/structural-prefix-risk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: structural-prefix-risk-research
  cancel-in-progress: true
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and verify selective guards
        run: |
          python -m py_compile superparser/scripts/audit_structural_prefix_risk.py
          PYTHONPATH=superparser python -m unittest -v superparser.tests.test_continuation_probe superparser.tests.test_structural_prefix_risk
      - name: Prepare WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          with urlopen(Request('https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip',
                 headers={'User-Agent':'Seman2-research'}),timeout=90) as f:
              data=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(data)) as z:
              for name in z.namelist():
                  leaf=Path(name).name
                  if name.startswith('wordnet/') and leaf in keep:
                      (dest/leaf).write_bytes(z.read(name))
          PY
      - name: Audit 256 structural risk estimates, one parse per sentence
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/audit_structural_prefix_risk.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --per-book-per-band 16 \
            --out-dir /tmp/structural-prefix-risk
      - name: Preserve per-sentence results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-prefix-risk-256
          path: /tmp/lexical-risk/
          retention-days: 14
          if-no-files-found: warn
