name: Seman2 - Focused Residual Grammar Validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/focused-residual-grammar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zipfile import ZipFile
          import os
          url = 'https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url, headers={'User-Agent': 'Seman2-research'}), timeout=90) as f:
              data = f.read()
          dest = Path(os.environ['RUNNER_TEMP']) / 'wordnet3' / 'dict'
          dest.mkdir(parents=True, exist_ok=True)
          wanted = {'lexnames', 'index.sense', 'frames.vrb', 'sentidx.vrb', 'sents.vrb', 'cntlist.rev'}
          for part in ('noun', 'verb', 'adj', 'adv'):
              wanted.update((f'index.{part}', f'data.{part}', f'{part}.exc'))
          with ZipFile(BytesIO(data)) as z:
              for name in z.namelist():
                  leaf = Path(name).name
                  if name.startswith('wordnet/') and leaf in wanted:
                      (dest / leaf).write_bytes(z.read(name))
          assert (dest / 'index.verb').exists()
          PY
      - name: Check eleven tests including the isolated with-absolute constituent
        run: |
          set -o pipefail
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser \
            python -m unittest -v superparser.tests.test_parser_integration.ResidualLiteraryCoverageTests \
            2>&1 | tee /tmp/residual-focused-tests.log
      - name: Verify case 497 corrective complement and counterexample
        run: |
          set -o pipefail
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser \
            python -m unittest -v superparser.tests.test_case_497_corrective_pp \
            2>&1 | tee /tmp/case497-tests.log
      - name: Diagnose raising alternatives, discourse attachments and ranking
        if: always()
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python - <<'PY'
          from seman_parser import Parser
          from pathlib import Path
          p=Parser.from_dir(Path("superparser/data"))
          samples=("He seemed to grow tired.",
                   "He seemed rather to grow weaker than regain his strength.",
                   "I have said the captain was weak, and indeed he seemed rather to grow weaker than regain his strength.",
                   "Mary saw so arduous an undertaking.",
                   "I have said the captain was weak.",
                   "And indeed he seemed tired.")
          def rules(node):
              yield node.rule_id
              for child in node.children:
                  yield from rules(child)
          for sentence in samples:
              parsed=p.parse(sentence, diagnostic_k=128, beam=128)
              print("DIAGNOSTIC_SENTENCE",repr(sentence),"completed",parsed.result.completed, flush=True)
              for c in parsed.lattice.candidates:
                  if c.surface.casefold()=="seemed":
                      print("DIAGNOSTIC_LEXICAL", c.category, c.features.as_dict(), c.source, flush=True)
              for i,root in enumerate(parsed.result.alternatives(limit=128)):
                  names=set(rules(root))
                  interesting=[n for n in names if "raising" in str(n) or "rather_to_than" in str(n) or n=="np_coord_adv"]
                  if i < 4 or interesting:
                      print("DIAGNOSTIC_TREE",i,root.rule_id,root.score,sorted(interesting),flush=True)
          PY
      - name: Audit three original novel parse cases and trees
        if: always()
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser \
            timeout 190s python -u -m scripts.audit_novel_tree_quality \
              --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
              --indices 349,427,439 --alternatives 1 \
              --max-items 50000 --kbest-work-limit 500000 \
            > /tmp/residual-trees.txt 2>&1
          code=$?
          grep '^NOVEL_TREE_AUDIT' /tmp/residual-trees.txt || true
          cat /tmp/residual-trees.txt
          exit "$code"
      - name: Verify recovered quote case 359 and audit inherited elliptical fragment 414
        if: always()
        run: |
          set -o pipefail
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser \
            timeout 140s python -u -m scripts.audit_quote_regressions \
              --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
              --indices 359,414 --budget 50000 --raised-budget 60000 \
            2>&1 | tee /tmp/quote-regression-ablation.log
      - name: Diagnose queued case 497 and its corrective prepositional attachment
        if: always()
        run: |
          set -o pipefail
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser \
            timeout 100s python -u -m scripts.audit_novel_tree_quality \
              --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
              --indices 497,359 --alternatives 3 \
              --max-items 50000 --kbest-work-limit 500000 \
            2>&1 | tee /tmp/case497-full-audit.log
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser \
            timeout 100s python -u - <<'PY' 2>&1 | tee /tmp/case497-constituents.log
          import json
          from pathlib import Path
          from seman_parser.engine import Parser, ParserResources
          from scripts.audit_novel_tree_quality import display_tree

          resources = ParserResources.from_dir(Path('superparser/data'))
          parser = Parser(resources, cache_size=0, max_items=50000)
          fragments = (
              'But there was no sign of reawakening courage in his followers.',
              'There was no sign of reawakening courage in his followers.',
              'There was no sign of growing terror at the irreverence of his words.',
              'There was no sign of reawakening courage, rather of growing terror.',
              'There was no sign of reawakening courage, rather, indeed, of growing terror.',
              'But there was no sign of reawakening courage in his followers, rather, indeed, of growing terror at the irreverence of his words.',
          )
          for fragment in fragments:
              report = parser.parse(fragment, max_items=50000,
                                    kbest_work_limit=500000, diagnostic_k=3)
              result = report.result
              stats = result.stats
              print('CASE497_FRAGMENT', json.dumps({
                  'text': fragment, 'completed': result.completed,
                  'root_rule': result.best().rule_id if result.best() else None,
                  'budget_exceeded': stats.get('budget_exceeded'),
                  'kbest_budget_exceeded': stats.get('kbest_budget_exceeded'),
                  'forest_nodes': stats.get('forest_nodes'),
                  'partial_states': stats.get('partial_states'),
                  'saturation_top_rules': stats.get('saturation_top_rules', []),
                  'saturation_top_categories': stats.get('saturation_top_categories', []),
                  'segmentation_fallback': stats.get('segmentation_fallback'),
              }, ensure_ascii=False), flush=True)
              for item in result.alternatives(limit=1):
                  print('CASE497_FRAGMENT_TREE', fragment, flush=True)
                  print('\n'.join(display_tree(item, result.text)), flush=True)
          for category, fragment in (
              ('NP', 'no sign of reawakening courage in his followers'),
              ('NP', 'reawakening courage'),
              ('NP', 'growing terror'),
              ('PP', 'of reawakening courage in his followers'),
              ('PP', 'of growing terror at the irreverence of his words'),
              ('NP', 'no sign of reawakening courage, rather of growing terror'),
          ):
              constituent_parser = Parser(resources, goal_category=category,
                                          cache_size=0, max_items=50000)
              result = constituent_parser.parse(fragment, max_items=50000,
                                                kbest_work_limit=500000,
                                                diagnostic_k=3).result
              print('CASE497_CONSTITUENT', json.dumps({
                  'category': category, 'text': fragment,
                  'completed': result.completed,
                  'root_rule': result.best().rule_id if result.best() else None,
                  'budget_exceeded': result.stats.get('budget_exceeded'),
                  'partial_states': result.stats.get('partial_states'),
              }, ensure_ascii=False), flush=True)
              for item in result.alternatives(limit=1):
                  print('\n'.join(display_tree(item, result.text)), flush=True)
          PY
      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residual-grammar-validation
          path: |
            /tmp/residual-focused-tests.log
            /tmp/residual-trees.txt
            /tmp/quote-regression-ablation.log
            /tmp/case497-tests.log
            /tmp/case497-full-audit.log
            /tmp/case497-constituents.log
          if-no-files-found: warn
          retention-days: 7
