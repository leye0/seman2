name: Novel-700 sourced corrections and frozen replay
on:
  push:
    branches: [research/novel-ladder-700]
    paths:
      - '.github/workflows/novel-700-validation.yml'
      - 'superparser/seman_parser/scoped_novel_700.py'
      - 'superparser/research/novel_ladder/novel-700-current.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          with urlopen(Request('https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip',headers={'User-Agent':'Seman2-research'}),timeout=90) as f:
              raw=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(raw)) as z:
              for item in z.namelist():
                  leaf=Path(item).name
                  if item.startswith('wordnet/') and leaf in keep:
                      (dest/leaf).write_bytes(z.read(item))
          PY
      - name: Assert source-grounded attachments and grammatical contrasts
        env:
          PYTHONPATH: superparser
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" python -m unittest -q superparser.tests.test_novel_700_attachments
      - name: Replay exact Novel-600 and Novel-700 case identities and budgets
        env:
          PYTHONPATH: superparser
        run: |
          python -m scripts.novel_ladder run --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" --out-dir "$RUNNER_TEMP/novel700-replay"
          python -m scripts.novel_ladder check --out-dir "$RUNNER_TEMP/novel700-replay"
      - name: Preserve the hosted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novel-700-validated-replay
          path: ${{ runner.temp }}/novel700-replay/
          retention-days: 14
          if-no-files-found: warn
