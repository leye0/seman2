name: Seman2 Two-Pass Gutenberg Memorization and Savings

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - '.github/workflows/snap-two-pass-gutenberg.yml'
      - 'superparser/scripts/benchmark_snap_two_passes.py'
      - 'superparser/scripts/render_snap_two_passes.py'
      - 'superparser/tests/test_snap_two_passes.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Replay ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pilot-3000
            size: 3000
            max_tokens: 24
            checkpoint: 250
          - label: novels-50000
            size: 50000
            max_tokens: 32
            checkpoint: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          with urlopen(Request(
                  'https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip',
                  headers={'User-Agent':'Seman2-research'}),timeout=90) as f:
              raw=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          names={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              names.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(raw)) as z:
              for entry in z.namelist():
                  base=Path(entry).name
                  if entry.startswith('wordnet/') and base in names:
                      (dest/base).write_bytes(z.read(entry))
          assert (dest/'index.verb').exists()
          PY
      - name: Verify replay tests
        run: |
          PYTHONPATH=superparser python -m unittest \
            superparser.tests.test_snap_two_passes \
            superparser.tests.test_verbnet_lr_full_structure_snap -v
          python -m py_compile \
            superparser/scripts/benchmark_snap_two_passes.py \
            superparser/scripts/render_snap_two_passes.py
      - name: Two complete passes over the identical novel corpus
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_snap_two_passes.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --max-sentences ${{ matrix.size }} \
            --max-tokens ${{ matrix.max_tokens }} \
            --checkpoint ${{ matrix.checkpoint }} \
            --out /tmp/seman2-two-pass-${{ matrix.label }}.json
      - name: Produce cumulative savings, recognition and latency graphs
        run: |
          python -m pip install --disable-pip-version-check matplotlib
          PYTHONPATH=superparser python superparser/scripts/render_snap_two_passes.py \
            --report /tmp/seman2-two-pass-${{ matrix.label }}.json \
            --out-prefix /tmp/seman2-two-pass-${{ matrix.label }}
      - name: Upload measured JSON, CSV, and PNG charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-two-pass-${{ matrix.label }}
          path: /tmp/seman2-two-pass-${{ matrix.label }}*
          if-no-files-found: warn
          retention-days: 30
