name: Audit Parser Lineage on Identical Syntax Corpus

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - '.github/workflows/parser-lineage-audit.yml'
      - 'superparser/scripts/benchmark_parser_lineage.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch WordNet 3.0 dictionary
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import os
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          uri='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(uri,headers={'User-Agent':'Seman2-research'}),timeout=90) as resp:
              content=resp.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          allowed={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              allowed.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(content)) as z:
              for path in z.namelist():
                  name=Path(path).name
                  if path.startswith('wordnet/') and name in allowed:
                      (dest/name).write_bytes(z.read(path))
          assert (dest/'index.verb').exists()
          PY
      - name: Compare complete classic syntax with research L-R on same 120 gold and 24 negatives
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_parser_lineage.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --limit 120 \
            --out /tmp/parser-lineage-audit.json
      - name: Persist comparable metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-parser-lineage-quality-comparison
          path: /tmp/parser-lineage-audit.json
          if-no-files-found: warn
          retention-days: 21
