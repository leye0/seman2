name: Hierarchical Grammatical Pattern C Research

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - 'superparser/scripts/benchmark_novel_hierarchical_patterns.py'
      - 'superparser/research/verbnet_lr/hierarchical_pattern_memory.py'
      - 'superparser/tests/test_verbnet_lr_hierarchical_pattern_memory.py'
      - '.github/workflows/novel-hierarchical-pattern-C.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check recursion and original unification rules
        run: |
          PYTHONPATH=superparser python -m unittest \
            superparser.tests.test_verbnet_lr_hierarchical_pattern_memory \
            superparser.tests.test_verbnet_lr_partial_structure_memory -v
      - name: Fetch reproducible WordNet lexicon
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import urlopen,Request
          from zipfile import ZipFile
          import os
          url='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url,headers={'User-Agent':'Seman2-research'}),timeout=90) as f: raw=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          allowed={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for n in ('noun','verb','adj','adv'):
              allowed.update({f'index.{n}',f'data.{n}',f'{n}.exc'})
          with ZipFile(BytesIO(raw)) as z:
              for name in z.namelist():
                  base=Path(name).name
                  if name.startswith('wordnet/') and base in allowed:
                      (dest/base).write_bytes(z.read(name))
          assert (dest/'index.verb').exists()
          PY
      - name: Measure original 100 ms research horizon
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_novel_hierarchical_patterns.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --train 2000 --eval-per-band 20 --max-span 18 \
            --max-expansions 20000 --max-wall-ms 100 --variants-per-cell 2 \
            --out /tmp/seman2-hierarchical-C-100ms.json
      - name: Explore deeper matching with 500 ms horizon
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_novel_hierarchical_patterns.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --train 2000 --eval-per-band 20 --max-span 18 \
            --max-expansions 20000 --max-wall-ms 500 --variants-per-cell 2 \
            --out /tmp/seman2-hierarchical-C-500ms.json
      - name: Explore four variants per constituent under 500 ms
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_novel_hierarchical_patterns.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --train 2000 --eval-per-band 20 --max-span 18 \
            --max-expansions 20000 --max-wall-ms 500 --variants-per-cell 4 \
            --out /tmp/seman2-hierarchical-C-500ms-beam4.json
      - name: Compare on identical test cases and search budgets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/seman2-hierarchical-C-100ms.json').read_text())
          b=json.loads(Path('/tmp/seman2-hierarchical-C-500ms.json').read_text())
          c=json.loads(Path('/tmp/seman2-hierarchical-C-500ms-beam4.json').read_text())
          assert a['book_catalog']==b['book_catalog']==c['book_catalog']
          assert a['training_counts']==b['training_counts']==c['training_counts']
          assert a['learned_pattern_system']==b['learned_pattern_system']==c['learned_pattern_system']
          assert a['budget']['max_expansions']==b['budget']['max_expansions']==c['budget']['max_expansions']
          assert a['budget']['variants_per_cell']==b['budget']['variants_per_cell']
          columns=['tested','NEW_tree_at_least_5_tokens','NEW_tree_at_least_8_tokens',
                   'NEW_tree_at_least_12_tokens','budget_truncated',
                   'grammar_unifications_attempted','grammar_unifications_passed']
          result={name:{'budget_ms':x['budget']['max_wall_ms'],
                        'variants_per_cell':x['budget']['variants_per_cell'],
                        'metrics':{k:x['heldout_counts'][k] for k in columns},
                        'latency_ms':x['latency_ms'],
                        'cutoffs':x['search_cutoff_reason_counts']}
                  for name,x in [('100ms_beam2',a),('500ms_beam2',b),
                                 ('500ms_beam4',c)]}
          Path('/tmp/seman2-hierarchical-C-comparison.json').write_text(
              json.dumps(result,indent=2)+'\\n')
          print('C_BUDGET_COMPARISON '+json.dumps(result),flush=True)
          PY
      - name: Preserve both reports and controlled comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-hierarchical-C-budget-and-beam-exploration
          path: /tmp/seman2-hierarchical-C-*.json
          if-no-files-found: warn
          retention-days: 30
