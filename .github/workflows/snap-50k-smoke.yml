name: Seman2 Two-Pass Structural Snap Quick Check

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - '.github/workflows/snap-50k-smoke.yml'
      - 'superparser/scripts/benchmark_snap_50k_two_pass.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          with urlopen(Request('https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip',
                 headers={'User-Agent':'Seman2-research'}),timeout=90) as f:
              data=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(data)) as z:
              for name in z.namelist():
                  leaf=Path(name).name
                  if name.startswith('wordnet/') and leaf in keep:
                      (dest/leaf).write_bytes(z.read(name))
          PY
      - name: Replay 1000 novel sentences twice with p50/p95
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_snap_50k_two_pass.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --size 1000 --max-tokens 45 --max-items 20000 \
            --parse-timeout 0.35 --match-timeout 0.2 \
            --checkpoint 250 --out /tmp/seman2-1000-snap-smoke.json
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-1000-snap-smoke
          path: /tmp/seman2-1000-snap-smoke.json
          if-no-files-found: warn
          retention-days: 7
