name: Hybrid C Guided Vector Forest Validation

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - 'superparser/research/verbnet_lr/hybrid_vector.py'
      - 'superparser/scripts/benchmark_hybrid_vector.py'
      - 'superparser/tests/test_verbnet_lr_hybrid_vector.py'
      - '.github/workflows/hybrid-C-vector-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch WordNet
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          url='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url,headers={'User-Agent':'Seman2-research'}),timeout=90) as f:
              content=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          allowed={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              allowed.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(content)) as z:
              for item in z.namelist():
                  base=Path(item).name
                  if item.startswith('wordnet/') and base in allowed:
                      (dest/base).write_bytes(z.read(item))
          assert (dest/'index.verb').exists()
          PY
      - name: Full-syntax and semantic-regression unit tests
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -m unittest \
            superparser.tests.test_verbnet_lr_hybrid_vector \
            superparser.tests.test_verbnet_lr_hierarchical_pattern_memory -v
      - name: Validate trained C rule agenda vs canonical forest
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_hybrid_vector.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --out /tmp/seman2-hybrid-vector-validation.json
      - name: Preserve quality and speed comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-hybrid-C-vector-validation
          path: /tmp/seman2-hybrid-vector-validation.json
          if-no-files-found: warn
          retention-days: 30
