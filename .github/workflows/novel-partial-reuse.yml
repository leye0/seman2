name: Research Novel Partial-Structure Recovery

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - 'superparser/scripts/benchmark_novel_partial_structures.py'
      - 'superparser/research/verbnet_lr/partial_structure_memory.py'
      - 'superparser/tests/test_verbnet_lr_partial_structure_memory.py'
      - 'superparser/seman_parser/reading_kernel_compiled_adapter.py'
      - '.github/workflows/novel-partial-reuse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  novel-salvage:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests for partial salvage and actual grammar revalidation
        run: |
          PYTHONPATH=superparser python -m unittest \
            superparser.tests.test_verbnet_lr_partial_structure_memory -v
      - name: Fetch WordNet 3.0 data
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import urlopen,Request
          from zipfile import ZipFile
          import os
          u='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(u,headers={'User-Agent':'Seman2-research'}),timeout=90) as source:
              raw=source.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          allowed={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for n in ('noun','verb','adj','adv'):
              allowed.update({f'index.{n}',f'data.{n}',f'{n}.exc'})
          with ZipFile(BytesIO(raw)) as z:
              for name in z.namelist():
                  stem=Path(name).name
                  if name.startswith('wordnet/') and stem in allowed:
                      (dest/stem).write_bytes(z.read(name))
          assert (dest/'index.verb').exists()
          PY
      - name: Recover from 3500 novel clauses and revalidate on 320 author-held-out sentences
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_novel_partial_structures.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --train 3500 --eval-per-band 40 --max-validations 96 \
            --out /tmp/novel-partial-reuse.json
      - name: Preserve aggregate report and rejection budget
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-novel-partial-reuse
          path: /tmp/novel-partial-reuse.json
          if-no-files-found: warn
          retention-days: 21
