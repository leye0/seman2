name: Gutenberg Canonical Vector vs Compiled L-R — Same Lattice

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - 'superparser/scripts/audit_vector_vs_lr_timed_gutenberg.py'
      - '.github/workflows/audit-vector-vs-lr-gutenberg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch WordNet
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          request=Request('https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip',
                          headers={'User-Agent':'Seman2-research'})
          with urlopen(request,timeout=90) as r: data=r.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for p in ('noun','verb','adj','adv'):
              keep.update((f'index.{p}',f'data.{p}',f'{p}.exc'))
          with ZipFile(BytesIO(data)) as z:
              for member in z.namelist():
                  k=Path(member).name
                  if member.startswith('wordnet/') and k in keep:
                      (dest/k).write_bytes(z.read(member))
          assert (dest/'index.verb').exists()
          PY
      - name: Stratified novel samples, same candidates and explicit per-sentence timeout
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/audit_vector_vs_lr_timed_gutenberg.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --per-band 50 --max-tokens 24 \
            --timeout-s 1.5 --max-items 30000 \
            --out /tmp/seman2-vector-vs-lr-novels.json
      - name: Persist coverage and p50/p75/p90
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-vector-vs-lr-same-lattice
          path: /tmp/seman2-vector-vs-lr-novels.json
          if-no-files-found: warn
          retention-days: 30
