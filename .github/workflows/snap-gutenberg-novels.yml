name: Project Gutenberg Novel-Scale Syntax Snapping

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - '.github/workflows/snap-gutenberg-novels.yml'
      - 'superparser/scripts/benchmark_snap_novels.py'
      - 'superparser/research/verbnet_lr/gutenberg_novels.py'
      - 'superparser/research/verbnet_lr/sampled_teacher.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  novel-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Novel extractor unit tests (no downloads)
        run: |
          PYTHONPATH=superparser python -m unittest \
            superparser.tests.test_verbnet_lr_gutenberg_novels -v
      - name: Download WordNet 3.0 dictionary
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zipfile import ZipFile
          import os
          url='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url,headers={'User-Agent':'Seman2-research'}),timeout=90) as source:
              raw=source.read()
          folder=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          folder.mkdir(parents=True,exist_ok=True)
          allowed={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for name in ('noun','verb','adj','adv'):
              allowed.update({f'index.{name}',f'data.{name}',f'{name}.exc'})
          with ZipFile(BytesIO(raw)) as archive:
              for item in archive.namelist():
                  basename=Path(item).name
                  if item.startswith('wordnet/') and basename in allowed:
                      (folder/basename).write_bytes(archive.read(item))
          assert (folder/'index.verb').exists()
          PY
      - name: Scan complete classic novels and learn on 10 percent
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_snap_novels.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --max-train 60000 --checkpoints 0,5000,20000,60000 \
            --every 10 --teacher-seconds 0.055 \
            --per-book-band 75 --max-teacher-tokens 32 \
            --out /tmp/snap-gutenberg-novel-report.json
      - name: Upload aggregate report (no book text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-novel-scale-report
          path: /tmp/snap-gutenberg-novel-report.json
          if-no-files-found: warn
          retention-days: 30
