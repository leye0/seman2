name: Source-grounded semantic review control candidates
on:
  push:
    branches: [research/novel-ladder-full-semantic-audit]
    paths:
      - 'superparser/tests/test_semantic_ladder_review_candidates.py'
      - 'superparser/tests/data/semantic_batch4_controls.json'
      - 'superparser/tests/test_novel_ladder.py'
      - 'superparser/tests/test_novel_700_residual.py'
      - 'superparser/scripts/novel_ladder.py'
      - '.github/workflows/semantic-review-candidates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          with urlopen(Request('https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip',headers={'User-Agent':'Seman2-research'}),timeout=90) as r:
              raw=r.read()
          dst=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dst.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for k in ('noun','verb','adj','adv'):
              keep.update((f'index.{k}',f'data.{k}',f'{k}.exc'))
          with ZipFile(BytesIO(raw)) as z:
              for item in z.namelist():
                  leaf=Path(item).name
                  if item.startswith('wordnet/') and leaf in keep:
                      (dst/leaf).write_bytes(z.read(item))
          PY
      - name: Original source, independent grammatical controls and wrong-attachment rejection
        env:
          PYTHONPATH: superparser
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" python -m unittest -v \
            superparser.tests.test_semantic_ladder_review_candidates \
            superparser.tests.test_novel_700_residual \
            superparser.tests.test_novel_ladder
