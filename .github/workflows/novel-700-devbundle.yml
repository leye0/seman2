name: Novel-700 local research test bundle
on:
  push:
    branches: [research/novel-ladder-700]
    paths:
      - '.github/workflows/novel-700-devbundle.yml'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare WordNet 3.0 dictionary
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zipfile import ZipFile
          import os
          url = 'https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url, headers={'User-Agent':'Seman2-research'}), timeout=90) as f:
              raw=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(raw)) as z:
              for item in z.namelist():
                  leaf=Path(item).name
                  if item.startswith('wordnet/') and leaf in keep:
                      (dest/leaf).write_bytes(z.read(item))
          assert (dest/'index.verb').exists()
          PY
      - name: Pack reproducible test files
        run: |
          mkdir -p /tmp/novel700dev/repo /tmp/novel700dev/wordnet
          cp -a superparser docs AGENTS.md /tmp/novel700dev/repo/
          cp -a "$RUNNER_TEMP/wordnet3/dict" /tmp/novel700dev/wordnet/
          tar -czf /tmp/novel700-devbundle.tar.gz -C /tmp novel700dev
          ls -lh /tmp/novel700-devbundle.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: novel700-local-test-bundle
          path: /tmp/novel700-devbundle.tar.gz
          retention-days: 7
          if-no-files-found: error
