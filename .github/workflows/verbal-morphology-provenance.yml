name: Seman2 - Verbal Morphology Provenance
on:
  push:
    branches: [main]
    paths:
      - 'superparser/research/verbal_provenance_trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          with urlopen(Request(
              'https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip',
              headers={'User-Agent':'Seman2-research'}), timeout=90) as f:
              raw=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(raw)) as z:
              for part in z.namelist():
                  leaf=Path(part).name
                  if part.startswith('wordnet/') and leaf in keep:
                      (dest/leaf).write_bytes(z.read(part))
          assert (dest/'index.verb').exists()
          PY
      - name: Inspect all lexical readings for contrasting verbal forms
        run: |
          PYTHONPATH=superparser python -u -m scripts.audit_verbal_readings \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --indices 281,365,485 \
            --out "$RUNNER_TEMP/verbal-provenance.json"
      - name: Inspect bundled VerbNet 3.4 resource structure and candidate classes
        run: |
          python - <<'PY'
          import gzip,json,re
          from pathlib import Path
          path=Path("superparser/research/verbnet_lr/verbnet34.compiled.json.gz")
          with gzip.open(path,"rt",encoding="utf8") as f:
              obj=json.load(f)
          print("VERBNET_SCHEMA",type(obj).__name__,
                list(obj)[:20] if isinstance(obj,dict) else len(obj),flush=True)
          targets=("fix","drink","encompass")
          found=[]
          def audit(o,path,depth=0):
              if depth>14 or len(found)>=70:return
              if isinstance(o,dict):
                  for k,v in o.items():
                      if any(re.search(r"(?<![A-Za-z])"+t+r"(?![A-Za-z])",str(k),re.I) for t in targets):
                          found.append({"path":path+"."+str(k),"value_preview":str(v)[:600]})
                      audit(v,path+"."+str(k),depth+1)
              elif isinstance(o,list):
                  for i,v in enumerate(o):
                      audit(v,path+"["+str(i)+"]",depth+1)
              elif isinstance(o,str) and any(re.search(r"(?<![A-Za-z])"+t+r"(?![A-Za-z])",o,re.I) for t in targets):
                  found.append({"path":path,"value":o[:250]})
          audit(obj,"root")
          print("VERBNET_MATCHES",json.dumps(found[:45],ensure_ascii=False),flush=True)
          Path("verbnet-valence-probe.json").write_text(
              json.dumps({"type":type(obj).__name__,
              "top_keys":list(obj)[:25] if isinstance(obj,dict) else [],
              "matches":found[:70]},ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Preserve bundled VerbNet lexical probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-verbnet-probe
          path: verbnet-valence-probe.json
          if-no-files-found: warn
          retention-days: 21
      - name: Preserve sense, morphology and valence provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-verbal-provenance
          path: ${{ runner.temp }}/verbal-provenance.json
          if-no-files-found: warn
          retention-days: 21
