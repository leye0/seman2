name: Seman2 - Verbal Morphology Provenance
on:
  push:
    branches: [main]
    paths:
      - 'superparser/research/verbal_provenance_trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          with urlopen(Request(
              'https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip',
              headers={'User-Agent':'Seman2-research'}), timeout=90) as f:
              raw=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(raw)) as z:
              for part in z.namelist():
                  leaf=Path(part).name
                  if part.startswith('wordnet/') and leaf in keep:
                      (dest/leaf).write_bytes(z.read(part))
          assert (dest/'index.verb').exists()
          PY
      - name: Verify bundled VerbNet valence evidence
        run: |
          PYTHONPATH=superparser python -m unittest -v \
            superparser.tests.test_verbnet_valence_provenance
      - name: Inspect all lexical readings for contrasting verbal forms
        run: |
          PYTHONPATH=superparser python -u -m scripts.audit_verbal_readings \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --indices 281,365,485 \
            --out "$RUNNER_TEMP/verbal-provenance.json"
      - name: Preserve sense, morphology and valence provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-verbal-provenance
          path: ${{ runner.temp }}/verbal-provenance.json
          if-no-files-found: warn
          retention-days: 21
