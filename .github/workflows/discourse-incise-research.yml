name: Seman2 - Discourse Incise Research
on:
  push:
    branches: [main]
    paths:
      - 'superparser/research/discourse_incise_trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch WordNet
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          with urlopen(Request('https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip',
              headers={'User-Agent':'Seman2-research'}),timeout=90) as f:raw=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(raw)) as z:
              for name in z.namelist():
                  leaf=Path(name).name
                  if name.startswith('wordnet/') and leaf in keep:
                      (dest/leaf).write_bytes(z.read(name))
          assert (dest/'index.verb').exists()
          PY
      - name: Compare independently licensed coordinator-incise-clause patterns
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -u -m scripts.audit_discourse_incises \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --output "$RUNNER_TEMP/discourse-incise-comparison.json"
      - name: Save source-aligned competing parse trees
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-discourse-incises
          path: ${{ runner.temp }}/discourse-incise-comparison.json
          if-no-files-found: warn
          retention-days: 21
