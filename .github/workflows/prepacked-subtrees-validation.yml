name: Certified C Subtree Replay — Canonical Forest A/B

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - 'superparser/research/verbnet_lr/prepacked_witnesses.py'
      - 'superparser/research/verbnet_lr/hybrid_vector.py'
      - 'superparser/seman_parser/vector_chart.py'
      - 'superparser/tests/test_verbnet_lr_prepacked_witnesses.py'
      - 'superparser/scripts/benchmark_prepacked_witnesses.py'
      - '.github/workflows/prepacked-subtrees-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          url='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url,headers={'User-Agent':'Seman2-research'}),timeout=90) as f: data=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(data)) as archive:
              for member in archive.namelist():
                  name=Path(member).name
                  if member.startswith('wordnet/') and name in keep:
                      (dest/name).write_bytes(archive.read(member))
          assert (dest/'index.verb').exists()
          PY
      - name: Test uniqueness proof, ambiguity, canonical full-tree parity
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -m unittest \
            superparser.tests.test_verbnet_lr_prepacked_witnesses \
            superparser.tests.test_verbnet_lr_hybrid_vector \
            superparser.tests.test_verbnet_lr_hierarchical_pattern_memory -v
      - name: Benchmark native operations and enforce A/B parity
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_prepacked_witnesses.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --out /tmp/seman2-prepacked-AB.json
      - name: Upload reproducible measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-certified-C-subtrees
          path: /tmp/seman2-prepacked-AB.json
          if-no-files-found: warn
          retention-days: 30
