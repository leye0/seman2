name: Seman2 - Novel parse diagnostics (500 sentences)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'superparser/research/novel_diagnostics_trigger.txt'
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * *'
permissions:
  contents: read
concurrency:
  group: novel-parse-diagnostics-main
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zipfile import ZipFile
          import os
          url = 'https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url, headers={'User-Agent': 'Seman2-research'}), timeout=90) as f:
              raw = f.read()
          dest = Path(os.environ['RUNNER_TEMP']) / 'wordnet3' / 'dict'
          dest.mkdir(parents=True, exist_ok=True)
          keep = {'lexnames', 'index.sense', 'frames.vrb', 'sentidx.vrb', 'sents.vrb', 'cntlist.rev'}
          for part in ('noun', 'verb', 'adj', 'adv'):
              keep.update((f'index.{part}', f'data.{part}', f'{part}.exc'))
          with ZipFile(BytesIO(raw)) as z:
              for item in z.namelist():
                  leaf = Path(item).name
                  if item.startswith('wordnet/') and leaf in keep:
                      (dest / leaf).write_bytes(z.read(item))
          assert (dest / 'index.verb').exists()
          PY
      - name: Validate diagnostic reporting
        run: |
          python -m py_compile superparser/scripts/benchmark_preflight_trie_pilot.py superparser/scripts/benchmark_integrated_preflight.py superparser/seman_parser/fast_preflight.py superparser/scripts/audit_fast_preflight.py superparser/scripts/probe_dialogue_rejections.py superparser/scripts/diagnose_novel_parses.py superparser/research/verbnet_lr/corpus_pipeline.py superparser/seman_parser/engine.py superparser/seman_parser/vector_chart.py superparser/seman_parser/sentence_boundaries.py
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -m unittest -v superparser.tests.test_novel_parse_diagnostics superparser.tests.test_sentence_boundaries superparser.tests.test_parser_integration superparser.tests.test_complexity_routing
      - name: Diagnose 500 cleaned novel sentences, once each
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/diagnose_novel_parses.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --count 500 --max-items 50000 --kbest-work-limit 500000 \
            --deadline-seconds 10 --out-dir /tmp/novel-parse-diagnostics
      - name: Audit original paragraph and sentence neighbors
        run: |
          PYTHONPATH=superparser python -m unittest -v superparser.tests.test_context_dependencies
          PYTHONPATH=superparser python -u -m scripts.audit_context_dependencies \
            --diagnostics /tmp/novel-parse-diagnostics/per_sentence.jsonl \
            --out-dir /tmp/novel-parse-diagnostics
      - name: Benchmark non-syntactic fast preflight against 500 canonical outcomes
        run: |
          PYTHONPATH=superparser python -m unittest -v superparser.tests.test_fast_preflight
          PYTHONPATH=superparser python -u -m scripts.audit_fast_preflight \
            --cohort /tmp/novel-parse-diagnostics/cohort.jsonl \
            --diagnostics /tmp/novel-parse-diagnostics/per_sentence.jsonl \
            --contexts /tmp/novel-parse-diagnostics/context_dependency.jsonl \
            --canonical-summary /tmp/novel-parse-diagnostics/summary.json \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --lexical-controls 26 --repetitions 7 \
            --out-dir /tmp/novel-parse-diagnostics
      - name: Triage frozen 26 residuals as research evidence
        run: |
          PYTHONPATH=superparser python -m unittest -v superparser.tests.test_residual_research_triage
          PYTHONPATH=superparser python -u -m scripts.triage_residual_26 \
            --diagnostics /tmp/novel-parse-diagnostics/per_sentence.jsonl \
            --contexts /tmp/novel-parse-diagnostics/context_dependency.jsonl \
            --failed /tmp/novel-parse-diagnostics/failed_sentences.jsonl \
            --summary /tmp/novel-parse-diagnostics/summary.json \
            --reference superparser/research/residual_26_reference.json \
            --out-dir /tmp/novel-parse-diagnostics
      - name: Independently probe scoped dialogue rejection evidence
        run: |
          PYTHONPATH=superparser python -u -m scripts.probe_dialogue_rejections \
            --cohort /tmp/novel-parse-diagnostics/cohort.jsonl \
            --diagnostics /tmp/novel-parse-diagnostics/per_sentence.jsonl \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --max-items 50000 --kbest-work-limit 500000 \
            --deadline-seconds 10 --trace-limit 48 \
            --out-dir /tmp/novel-parse-diagnostics
      - name: Synthesize independently observed evidence for all 26 historical residuals
        run: |
          PYTHONPATH=superparser python -m unittest -v superparser.tests.test_residual_evidence_synthesis superparser.tests.test_local_constituent_proofs
          PYTHONPATH=superparser python -u -m scripts.synthesize_residual_evidence \
            --register /tmp/novel-parse-diagnostics/residual_research_cases.jsonl \
            --register-summary /tmp/novel-parse-diagnostics/residual_research_summary.json \
            --preflight /tmp/novel-parse-diagnostics/fast_preflight_cases.jsonl \
            --lexical /tmp/novel-parse-diagnostics/fast_preflight_lexical_spotcheck.jsonl \
            --dialogue /tmp/novel-parse-diagnostics/dialogue_rejection_probes.jsonl \
            --dialogue-summary /tmp/novel-parse-diagnostics/dialogue_rejection_summary.json \
            --comparators /tmp/novel-parse-diagnostics/dialogue_rejection_comparators.jsonl \
            --out-dir /tmp/novel-parse-diagnostics
      - name: Benchmark full public Parser.parse with and without integrated preflight
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -m unittest -v superparser.tests.test_integrated_fast_preflight
          PYTHONPATH=superparser python -u -m scripts.benchmark_integrated_preflight \
            --cohort /tmp/novel-parse-diagnostics/cohort.jsonl \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --max-items 50000 --kbest-work-limit 500000 \
            --repeats 2 --deadline-seconds 10 \
            --out-dir /tmp/novel-parse-diagnostics
      - name: Pilot experimental preflight-to-trie routing with whole-parser parity audit
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -m unittest -v superparser.tests.test_preflight_routing
          PYTHONPATH=superparser python -u -m scripts.benchmark_preflight_trie_pilot \
            --cohort /tmp/novel-parse-diagnostics/cohort.jsonl \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --minimum-tokens 17 --routed-count 12 --control-count 6 \
            --repeats 4 --max-items 50000 --kbest-work-limit 500000 \
            --deadline-seconds 10 --out-dir /tmp/novel-parse-diagnostics
      - name: Guard fixed-cohort coverage near the verified 460/500 checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/novel-parse-diagnostics/summary.json').read_text())
          totals = summary['totals']
          assert totals['n'] == 500, totals
          assert totals['statuses']['error'] == 0, totals
          assert totals['completed'] >= 457, (
              f"Fixed literary cohort coverage regressed: {totals['completed']}/500 "
              '(minimum accepted after 457-to-460 fixed-cohort checkpoint: 457/500; audit per-case tree quality independently)'
          )
          print('NOVEL_COVERAGE_GATE', totals['completed'], '/500')
          PY
      - name: Preserve per-sentence diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novel-parse-diagnostics-500
          path: /tmp/novel-parse-diagnostics/
          retention-days: 90
          if-no-files-found: warn
