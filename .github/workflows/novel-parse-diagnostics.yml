name: Seman2 - Novel parse diagnostics (500 sentences)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'superparser/research/novel_diagnostics_trigger.txt'
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * *'
permissions:
  contents: read
concurrency:
  group: novel-parse-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zipfile import ZipFile
          import os
          url = 'https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url, headers={'User-Agent': 'Seman2-research'}), timeout=90) as f:
              raw = f.read()
          dest = Path(os.environ['RUNNER_TEMP']) / 'wordnet3' / 'dict'
          dest.mkdir(parents=True, exist_ok=True)
          keep = {'lexnames', 'index.sense', 'frames.vrb', 'sentidx.vrb', 'sents.vrb', 'cntlist.rev'}
          for part in ('noun', 'verb', 'adj', 'adv'):
              keep.update((f'index.{part}', f'data.{part}', f'{part}.exc'))
          with ZipFile(BytesIO(raw)) as z:
              for item in z.namelist():
                  leaf = Path(item).name
                  if item.startswith('wordnet/') and leaf in keep:
                      (dest / leaf).write_bytes(z.read(item))
          assert (dest / 'index.verb').exists()
          PY
      - name: Validate diagnostic reporting
        run: |
          python -m py_compile superparser/scripts/benchmark_preflight_trie_pilot.py superparser/scripts/benchmark_integrated_preflight.py superparser/seman_parser/fast_preflight.py superparser/scripts/audit_fast_preflight.py superparser/scripts/probe_dialogue_rejections.py superparser/scripts/diagnose_novel_parses.py superparser/research/verbnet_lr/corpus_pipeline.py superparser/seman_parser/engine.py superparser/seman_parser/vector_chart.py superparser/seman_parser/sentence_boundaries.py
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -m unittest -v superparser.tests.test_novel_parse_diagnostics superparser.tests.test_sentence_boundaries superparser.tests.test_structural_units superparser.tests.test_structural_preanalysis superparser.tests.test_quoted_discourse_structure superparser.tests.test_dialogue_residual_audit superparser.tests.test_discourse_triage superparser.tests.test_fragment_grammar_rules superparser.tests.test_parser_integration superparser.tests.test_complexity_routing
      - name: Measure source-unit segmentation independently of grammar
        run: |
          PYTHONPATH=superparser python -m scripts.audit_corpus_segmentation \
            --out /tmp/novel-parse-diagnostics/segmentation_quality.json
      - name: Review potentially permissive grammar productions without deleting rules
        run: |
          PYTHONPATH=superparser python -m scripts.audit_fragment_grammar_rules \
            --out-dir /tmp/novel-parse-diagnostics
      - name: Diagnose 500 cleaned novel sentences, once each
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/diagnose_novel_parses.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --count 500 --max-items 50000 --kbest-work-limit 500000 \
            --deadline-seconds 10 --out-dir /tmp/novel-parse-diagnostics
      - name: Audit direct-speech failures by actual quotation source spans
        run: |
          PYTHONPATH=superparser python -m scripts.audit_dialogue_failures \
            --diagnostics /tmp/novel-parse-diagnostics/per_sentence.jsonl \
            --out /tmp/novel-parse-diagnostics/dialogue_residual_audit.json
      - name: Audit original paragraph and sentence neighbors
        run: |
          PYTHONPATH=superparser python -m unittest -v superparser.tests.test_context_dependencies
          PYTHONPATH=superparser python -u -m scripts.audit_context_dependencies \
            --diagnostics /tmp/novel-parse-diagnostics/per_sentence.jsonl \
            --out-dir /tmp/novel-parse-diagnostics
      - name: Rebuild current grammar case queue from actual outcomes
        run: |
          PYTHONPATH=superparser python -m scripts.rebuild_grammar_case_queue \
            --diagnostics /tmp/novel-parse-diagnostics/per_sentence.jsonl \
            --summary /tmp/novel-parse-diagnostics/summary.json \
            --out /tmp/novel-parse-diagnostics/grammar_case_queue.json
      - name: Emit queue data for deliberate active-cohort migration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/novel-parse-diagnostics/grammar_case_queue.json')
          print('CURRENT_QUEUE_JSON', json.dumps(json.loads(p.read_text()), ensure_ascii=True, separators=(',', ':')), flush=True)
          PY
      - name: Validate active cohort and report measured coverage
        run: |
          PYTHONPATH=superparser python - <<'PY'
          import json
          from pathlib import Path
          from scripts.diagnose_novel_parses import EXPECTED_500_COHORT_SHA256
          summary=json.loads(Path('/tmp/novel-parse-diagnostics/summary.json').read_text())
          totals=summary['totals']
          assert totals['n']==500, totals
          assert summary['cohort_sha256']==EXPECTED_500_COHORT_SHA256
          assert totals['statuses']['error']==0, totals
          print('CURRENT_COHORT_COVERAGE', totals['completed'], '/500', flush=True)
          PY
      - name: Preserve per-sentence diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novel-parse-diagnostics-500
          path: /tmp/novel-parse-diagnostics/
          retention-days: 90
          if-no-files-found: warn
