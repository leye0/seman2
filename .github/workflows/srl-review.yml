name: SRL protocol and external PropBank review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'superparser/scripts/review_srl.py'
      - '.github/workflows/srl-review.yml'
permissions:
  contents: read
jobs:
  review:
    strategy:
      fail-fast: false
      matrix:
        model: [large, base]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: superparser
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install identical runtime
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-srl.txt -r requirements-canonical.txt
      - name: Compare upstream inference modes and independent annotations
        run: python -m scripts.review_srl --model "${{ matrix.model }}" --out-dir "$RUNNER_TEMP/srl-review"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srl-review-${{ matrix.model }}
          path: ${{ runner.temp }}/srl-review/
          if-no-files-found: warn
          retention-days: 30
