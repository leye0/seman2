name: Seman2 — CPU / GC 1000 phrases
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpu-gc-1000-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seman2-cpu-gc-1000-benchmark
  cancel-in-progress: true
jobs:
  gc-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          url='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url,headers={'User-Agent':'Seman2-CPU-audit'}),timeout=90) as r:
              data=r.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(data)) as z:
              for item in z.namelist():
                  leaf=Path(item).name
                  if item.startswith('wordnet/') and leaf in keep:
                      (dest/leaf).write_bytes(z.read(item))
          assert (dest/'index.verb').exists()
          PY
      - name: Verify benchmark syntax
        run: |
          python -m py_compile tools/cpu_gc_1000_benchmark.py
      - name: Run four matched CPU passes of 1000 distinct novel sentences
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -u tools/cpu_gc_1000_benchmark.py --limit 1000
      - name: Save full structured timing, memory, GC and digest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-gc-1000-results
          path: _cpu_gc_1000/
          retention-days: 30
          if-no-files-found: warn
