name: Gutenberg Complete-Novel Corpus Audit

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - '.github/workflows/snap-gutenberg-corpus-audit.yml'
      - 'superparser/scripts/audit_gutenberg_novels.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit full source corpus without model inference
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/audit_gutenberg_novels.py
      - name: Preserve audited book counts and source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gutenberg-novel-corpus-audit
          path: /tmp/gutenberg-corpus-audit.json
          if-no-files-found: warn
          retention-days: 30
