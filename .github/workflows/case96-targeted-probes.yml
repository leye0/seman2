name: Seman2 - Case 96 targeted grammar fix probes

on:
  push:
    branches: [research/case96-real-fix-20261111]
    paths:
      - '.github/workflows/case96-targeted-probes.yml'
      - 'superparser/scripts/audit_case96_constructs.py'
      - 'superparser/seman_parser/sentence_boundaries.py'
      - 'superparser/research/verbnet_lr/gutenberg_novels.py'
      - 'superparser/tests/test_sentence_boundaries.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing segmentation and source integrity
        run: |
          PYTHONPATH=superparser python -m unittest -v \
            superparser.tests.test_sentence_boundaries \
            superparser.tests.test_context_dependencies \
            superparser.tests.test_clean_novel_corpus
      - name: Prepare reference WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zipfile import ZipFile
          import os
          url = 'https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url, headers={'User-Agent': 'Seman2-research'}), timeout=90) as reply:
              raw = reply.read()
          dest = Path(os.environ['RUNNER_TEMP']) / 'wordnet3' / 'dict'
          dest.mkdir(parents=True, exist_ok=True)
          needed = {'lexnames', 'index.sense', 'frames.vrb', 'sentidx.vrb', 'sents.vrb', 'cntlist.rev'}
          for part in ('noun', 'verb', 'adj', 'adv'):
              needed.update((f'index.{part}', f'data.{part}', f'{part}.exc'))
          with ZipFile(BytesIO(raw)) as archive:
              for name in archive.namelist():
                  leaf = Path(name).name
                  if name.startswith('wordnet/') and leaf in needed:
                      (dest / leaf).write_bytes(archive.read(name))
          assert (dest / 'index.verb').is_file()
          PY
      - name: Audit the original case94 source and isolated constituents
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser \
            python -u -m scripts.audit_case96_constructs \
              --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
              --out /tmp/seman2-case96-probes.json
      - name: Preserve all probe trees and source spans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-case96-probe-trees
          path: /tmp/seman2-case96-probes.json
          retention-days: 30
          if-no-files-found: warn
