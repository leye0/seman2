name: Authentic Syntax Snap Learning Curve

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - '.github/workflows/snap-authentic-learning.yml'
      - 'superparser/scripts/benchmark_snap_learning_curve.py'
      - 'superparser/research/verbnet_lr/sampled_teacher.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch WordNet 3.0 dictionary
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import os
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          url='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url,headers={'User-Agent':'Seman2-research'}),timeout=90) as r:
              data=r.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          allowed={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for suffix in ('noun','verb','adj','adv'):
              allowed.update((f'index.{suffix}',f'data.{suffix}',f'{suffix}.exc'))
          with ZipFile(BytesIO(data)) as archive:
              for name in archive.namelist():
                  base=Path(name).name
                  if name.startswith('wordnet/') and base in allowed:
                      (dest/base).write_bytes(archive.read(name))
          assert (dest/'index.verb').exists()
          PY
      - name: Authentic full-sentence grammar learning and 10 percent teacher
        run: |
          PYTHONPATH=superparser python superparser/scripts/benchmark_snap_learning_curve.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --max-external 600 --milestones 0,100,300,600 \
            --external-seconds 0.16 --dev-seconds 0.35 \
            --out /tmp/snap-authentic-learning.json
      - name: Upload reproducible report
        uses: actions/upload-artifact@v4
        with:
          name: authentic-syntax-learning-report
          path: /tmp/snap-authentic-learning.json
          retention-days: 14
