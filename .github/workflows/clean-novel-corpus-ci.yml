name: Clean Novel Corpus Integrity

on:
  push:
    branches:
      - main
      - cleanup/canonical-vector-and-history
    paths:
      - '.github/workflows/clean-novel-corpus-ci.yml'
      - 'superparser/seman_parser/sentence_boundaries.py'
      - 'superparser/seman_parser/coverage.py'
      - 'superparser/research/verbnet_lr/gutenberg_novels.py'
      - 'superparser/research/verbnet_lr/clean_novel_corpus.py'
      - 'superparser/research/verbnet_lr/corpora/**'
      - 'superparser/tests/test_sentence_boundaries.py'
      - 'superparser/tests/test_clean_novel_corpus.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pinned cleaned novel hashes
        run: |
          PYTHONPATH=superparser python -m research.verbnet_lr.clean_novel_corpus --check
      - name: Verify quotation marks, initials, boundaries and full corpus round-trips
        run: |
          PYTHONPATH=superparser python -m unittest discover -s superparser/tests -p 'test_sentence_boundaries.py' -v
          PYTHONPATH=superparser python -m unittest discover -s superparser/tests -p 'test_clean_novel_corpus.py' -v
