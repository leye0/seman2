name: Novel-700 full frozen replay and Layer-1 protection
on:
  push:
    branches: [research/novel-ladder-700-fix]
    paths:
      - '.github/workflows/novel-700-final-replay.yml'
permissions:
  contents: read
jobs:
  ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use pinned WordNet 3.0 dictionary
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          with urlopen(Request('https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip',headers={'User-Agent':'Seman2-research'}),timeout=90) as f:
              raw=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(raw)) as z:
              for item in z.namelist():
                  leaf=Path(item).name
                  if item.startswith('wordnet/') and leaf in keep:
                      (dest/leaf).write_bytes(z.read(item))
          PY
      - name: Confirm all 12 independent grammar and graph controls
        env:
          PYTHONPATH: superparser
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" python -m unittest -q superparser.tests.test_novel_700_residual superparser.tests.test_novel_700_attachments superparser.tests.test_structural_preanalysis
      - name: Reparse exactly 100 accepted Novel-600 and 100 frozen Novel-700 sources
        env:
          PYTHONPATH: superparser
        run: |
          python -m scripts.novel_ladder run --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" --out-dir /tmp/novel700-full-replay
      - name: Verify 600 byte-identical selected signatures and 12 recovered rank-one graphs
        env:
          PYTHONPATH: superparser
        run: |
          python -m scripts.verify_novel700_replay --out-dir /tmp/novel700-full-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novel700-fully-audited-replay
          path: /tmp/novel700-full-replay/
          retention-days: 14
          if-no-files-found: warn
  layer1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use pinned WordNet 3.0 dictionary
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          with urlopen(Request('https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip',headers={'User-Agent':'Seman2-research'}),timeout=90) as f:
              raw=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(raw)) as z:
              for item in z.namelist():
                  leaf=Path(item).name
                  if item.startswith('wordnet/') and leaf in keep:
                      (dest/leaf).write_bytes(z.read(item))
          PY
      - name: Re-run all 500 original novel source cases and protected rank-one fingerprints
        env:
          PYTHONPATH: superparser
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" python -m scripts.diagnose_novel_parses --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" --count 500 --max-items 50000 --kbest-work-limit 500000 --deadline-seconds 10 --out-dir /tmp/novel700-layer1
          python - <<'PY'
          from pathlib import Path
          from scripts.novel_ladder import compare_legacy, read_json, LADDER
          compare_legacy(Path('/tmp/novel700-layer1/per_sentence.jsonl'),
              read_json(LADDER/'novel-500-protected.json')['rank_one_run_sha256'])
          print('NOVEL_500_ALL_PROTECTED_TREES_IDENTICAL',flush=True)
          PY
      - name: Anchored real dialogue 30 and direct syntax quality certificates
        env:
          PYTHONPATH: superparser
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" python -m scripts.audit_anchored_dialogue_30 --diagnostics /tmp/novel700-layer1/per_sentence.jsonl --summary /tmp/novel700-layer1/summary.json --out /tmp/novel700-layer1/anchored_dialogue_30.json
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" python -m scripts.smoke_layer1
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" python -m scripts.validate_direct_grammar --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" --out /tmp/novel700-layer1/direct-quality.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novel700-layer1-protection
          path: /tmp/novel700-layer1/
          retention-days: 14
          if-no-files-found: warn
