name: Seman2 Identical Corpus — Structural Snap Sanity

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - 'superparser/scripts/benchmark_vector_identical_snap.py'
      - '.github/workflows/vector-identical-snap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          url='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url,headers={'User-Agent':'Seman2-research'}),timeout=90) as f:
              raw=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(raw)) as z:
              for item in z.namelist():
                  name=Path(item).name
                  if item.startswith('wordnet/') and name in keep:
                      (dest/name).write_bytes(z.read(item))
          assert (dest/'index.verb').exists()
          PY
      - name: First pass learn vector trees, second pass structural snapping
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_vector_identical_snap.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --count 200 --max-tokens 12 --timeout 1.5 \
            --out /tmp/seman2-identical-snap.json
      - name: Preserve detailed structural recall and misses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-identical-snap-test
          path: /tmp/seman2-identical-snap.json
          if-no-files-found: warn
          retention-days: 30
