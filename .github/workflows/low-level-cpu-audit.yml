name: Seman2 — Low-level Python CPU audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/low-level-cpu-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seman2-low-level-cpu
  cancel-in-progress: true

jobs:
  implementation-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch WordNet 3.0 (existing parser resource)
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          url='https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip'
          with urlopen(Request(url,headers={'User-Agent':'Seman2-CPU-audit'}),timeout=90) as r:
              data=r.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(data)) as z:
              for item in z.namelist():
                  leaf=Path(item).name
                  if item.startswith('wordnet/') and leaf in keep:
                      (dest/leaf).write_bytes(z.read(item))
          assert (dest/'index.verb').exists()
          PY

      - name: Verify profiler code and install line profiler
        run: |
          python -m py_compile tools/cpu_implementation_profile.py
          python -m pip install --disable-pip-version-check line-profiler

      - name: Profile unmodified canonical path, per-function CPU and memory
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -u tools/cpu_implementation_profile.py --mode core

      - name: Profile per-line hot Python functions
        run: |
          WORDNET_DICT="$RUNNER_TEMP/wordnet3/dict" PYTHONPATH=superparser python -u tools/cpu_implementation_profile.py --mode lines

      - name: Retain complete CPU, cProfile, memory, static and line profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seman2-low-level-cpu
          path: _cpu_results/
          retention-days: 30
          if-no-files-found: warn
