name: Compiled Tree Snap — 2000 Genuine Novel Sentences

on:
  push:
    branches:
      - research/verbnet-left-to-right-poc
    paths:
      - 'superparser/research/verbnet_lr/compiled_structure_snap.py'
      - 'superparser/scripts/benchmark_compiled_snap_2k.py'
      - 'superparser/tests/test_compiled_structure_snap.py'
      - '.github/workflows/compiled-snap-2k.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiled-snap-2k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiled-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        size: [250, 2000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare WordNet 3.0
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request,urlopen
          from zipfile import ZipFile
          import os
          with urlopen(Request('https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip',
                 headers={'User-Agent':'Seman2-research'}),timeout=90) as f:
              data=f.read()
          dest=Path(os.environ['RUNNER_TEMP'])/'wordnet3'/'dict'
          dest.mkdir(parents=True,exist_ok=True)
          keep={'lexnames','index.sense','frames.vrb','sentidx.vrb','sents.vrb','cntlist.rev'}
          for part in ('noun','verb','adj','adv'):
              keep.update((f'index.{part}',f'data.{part}',f'{part}.exc'))
          with ZipFile(BytesIO(data)) as z:
              for name in z.namelist():
                  leaf=Path(name).name
                  if name.startswith('wordnet/') and leaf in keep:
                      (dest/leaf).write_bytes(z.read(name))
          PY
      - name: Run compiled no-parser regression tests
        run: |
          PYTHONPATH=superparser python -m unittest -v superparser.tests.test_compiled_structure_snap
      - name: Learn and replay authentic novel sentences without parsing timeouts
        run: |
          PYTHONPATH=superparser python -u superparser/scripts/benchmark_compiled_snap_2k.py \
            --wordnet-dir "$RUNNER_TEMP/wordnet3/dict" \
            --size ${{ matrix.size }} --max-tokens 32 \
            --out /tmp/compiled-snap-${{ matrix.size }}.json
      - name: Preserve result even on strict latency failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-snap-${{ matrix.size }}-report
          path: /tmp/compiled-snap-${{ matrix.size }}.json
          if-no-files-found: warn
          retention-days: 7
